server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/filmdrop?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  mail:
    host: smtp.example.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.filmdrop.*.model
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

xxl-job:
  admin:
    addresses: http://localhost:8081/xxl-job-admin
  accessToken: ${XXL_JOB_TOKEN:default_token}
  executor:
    appname: filmdrop-push
    port: 9999
    logretentiondays: 30
